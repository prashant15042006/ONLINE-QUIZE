<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline – ExamiQ</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: #080710;
      color: #e2e8f0;
      font-family: 'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .logo {
      width: 80px;
      height: 80px;
      border-radius: 20px;
      overflow: hidden;
      margin: 0 auto 1.5rem;
      border: 2px solid rgba(16,185,129,0.3);
      box-shadow: 0 0 30px rgba(16,185,129,0.2);
    }
    .logo img { width: 100%; height: 100%; object-fit: cover; }
    h1 {
      font-size: 2rem;
      font-weight: 900;
      background: linear-gradient(135deg, #10b981, #06b6d4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.5rem;
    }
    .badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      background: rgba(16,185,129,0.15);
      color: #34d399;
      border: 1px solid rgba(16,185,129,0.3);
      padding: 2px 8px;
      border-radius: 999px;
      margin-bottom: 2rem;
    }
    .card {
      background: rgba(15,23,42,0.8);
      border: 1px solid rgba(51,65,85,0.6);
      border-radius: 20px;
      padding: 2rem;
      max-width: 380px;
      width: 100%;
    }
    .icon { font-size: 3rem; margin-bottom: 1rem; display: block; }
    h2 { font-size: 1.25rem; font-weight: 700; color: #f1f5f9; margin-bottom: 0.75rem; }
    p { font-size: 0.875rem; color: #94a3b8; line-height: 1.6; margin-bottom: 1.5rem; }
    .tips {
      text-align: left;
      list-style: none;
      margin-bottom: 1.5rem;
    }
    .tips li {
      font-size: 0.8rem;
      color: #64748b;
      padding: 0.35rem 0;
      border-bottom: 1px solid rgba(51,65,85,0.3);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .tips li:last-child { border-bottom: none; }
    .tips li span { font-size: 1rem; }
    button {
      width: 100%;
      padding: 0.875rem;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #10b981, #06b6d4);
      color: white;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.9; }
    button:active { transform: scale(0.98); }
  </style>
</head>
<body>
  <div class="logo">
    <img src="/logo.jpg" alt="ExamiQ Logo" />
  </div>
  <h1>ExamiQ</h1>
  <span class="badge">PRO</span>

  <div class="card">
    <span class="icon">📡</span>
    <h2>You're Offline</h2>
    <p>No internet connection detected. Don't worry — your bookmarks and notes are saved locally.</p>
    <ul class="tips">
      <li><span>📚</span> Bookmarked questions available offline</li>
      <li><span>❌</span> Mistakes notebook accessible locally</li>
      <li><span>⚡</span> Progress stats cached on device</li>
      <li><span>🌐</span> AI features need internet</li>
    </ul>
    <button onclick="window.location.reload()">🔄 Try Again</button>
  </div>
</body>
</html>
