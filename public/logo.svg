<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="cyan-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#00f5a0"/>
    </linearGradient>
    <linearGradient id="grad-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Badge Container -->
  <rect width="512" height="512" rx="120" fill="#080710"/>
  <rect x="16" y="16" width="480" height="480" rx="104" stroke="url(#cyan-emerald)" stroke-opacity="0.3" stroke-width="6"/>

  <!-- Stylized Graduation Cap -->
  <g transform="translate(256, 175)" filter="url(#neon-glow)">
    <path d="M 0 -75 L 140 -10 L 0 55 L -140 -10 Z" fill="url(#cyan-emerald)" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>
    <path d="M -90 12 L -90 65 C -90 90, 90 90, 90 65 L 90 12" fill="none" stroke="url(#grad-glow)" stroke-width="14" stroke-linecap="round"/>
    <!-- Tassel -->
    <path d="M 90 -12 L 125 40" stroke="#f59e0b" stroke-width="6" stroke-linecap="round"/>
    <circle cx="125" cy="45" r="8" fill="#fbbf24"/>
  </g>

  <!-- Stylized Letter Q Ring -->
  <g transform="translate(256, 330)">
    <circle cx="0" cy="0" r="90" fill="none" stroke="url(#cyan-emerald)" stroke-width="24" filter="url(#neon-glow)"/>
    <path d="M 25 25 L 85 85" stroke="url(#cyan-emerald)" stroke-width="28" stroke-linecap="round" filter="url(#neon-glow)"/>
  </g>
</svg>
