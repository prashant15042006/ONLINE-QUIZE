services:
  - type: web
    name: online-quiz-backend
    env: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: PORT
        value: 4000
      - key: NODE_ENV
        value: production
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: poolside/laguna-m.1:free
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
